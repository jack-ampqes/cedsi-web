<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #131233; font-family: Inter, system-ui, sans-serif; }
    a { color: #8ab8ff; }
    a:hover { color: #c9dcff; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .dashline { stroke-dasharray: 10 16; animation: dcflow2 3s linear infinite; }
    @keyframes dcflow2 { to { stroke-dashoffset: -52; } }
    @media (prefers-reduced-motion: reduce) { .dashline { animation: none; } }
  </style>
</helmet>
<div style="width: 600px; height: 600px; padding: 20px; box-sizing: border-box; position: relative; background: #131233;">
  <div style="position: relative; width: 100%; height: 100%; border: 1px solid #4a5160; border-radius: 8px; background: #11102e; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: linear-gradient(to right, #4b51604d 1px, transparent 1px), linear-gradient(to bottom, #4b51604d 1px, transparent 1px); background-size: 40px 40px;"></div>
    <div style="position: absolute; inset: 32px; border: 2px dashed #ffffff4d; border-radius: 8px; padding: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 448 448" style="width: 100%; height: 100%; display: block;" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="mglow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="8" result="b"></feGaussianBlur>
            <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
        </defs>

        <path d="M224 250 H 112 M224 250 H 336" fill="none" stroke="#f4f5f8" stroke-opacity="0.22" stroke-width="2"></path>
        <g stroke="#f4f5f8" stroke-opacity="0.22" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M112 250 V 330"></path>
          <path d="M336 250 V 330"></path>
        </g>

        <path d="M224 74 V 250" fill="none" stroke="{{accent}}" stroke-opacity="0.18" stroke-width="12" stroke-linecap="round" filter="url(#mglow)"></path>
        <path d="M72 250 H 376" fill="none" stroke="{{accent}}" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round"></path>
        <path d="M224 74 V 330" fill="none" stroke="{{accent}}" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"></path>
        <path class="dashline" d="M224 74 V 330" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.75" stroke-linecap="round"></path>

        <g fill="#11102e" stroke="#f4f5f8" stroke-opacity="0.5" stroke-width="2">
          <circle cx="224" cy="54" r="20"></circle>
          <path d="M214 54 q5 -7.5 10 0 q5 7.5 10 0" fill="none" stroke-opacity="0.8"></path>
          <circle cx="224" cy="140" r="22" fill="none"></circle>
          <circle cx="224" cy="172" r="22" fill="none"></circle>
          <rect x="80" y="330" width="64" height="46" rx="2"></rect>
          <rect x="304" y="330" width="64" height="46" rx="2"></rect>
        </g>
        <g fill="#11102e" stroke="{{accent}}" stroke-opacity="0.9" stroke-width="2">
          <rect x="192" y="330" width="64" height="46" rx="2"></rect>
          <path d="M202 344 H 246 M202 353 H 246 M202 362 H 246" stroke-opacity="0.4"></path>
        </g>

        <g class="mono" letter-spacing="1.2">
          <text x="376" y="238" text-anchor="end" font-size="11" fill="{{accent}}">480 V BUS</text>
          <g font-size="9" fill="#c4c8d2" fill-opacity="0.55" text-anchor="middle">
            <text x="112" y="396">MCC</text>
            <text x="336" y="396">LIGHTING</text>
          </g>
          <text x="224" y="396" text-anchor="middle" font-size="9" fill="{{accent}}">UL 508A PANEL</text>
          <text x="256" y="59" font-size="9" fill="#c4c8d2" fill-opacity="0.55">13.8 kV SERVICE</text>
          <text x="256" y="161" font-size="9" fill="#c4c8d2" fill-opacity="0.55">1500 kVA</text>
        </g>
      </svg>
    </div>
  </div>
  <div style="position: absolute; right: 4px; bottom: 4px; background: #ffffff; color: #20232b; padding: 8px 16px; border-radius: 8px; box-shadow: 0 0 20px #002f5d66, 0 0 40px #002f5d33; font-size: 14px; font-weight: 600;">UL 508A Certified</div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#8ab8ff","options":["#8ab8ff","#164f83","#f4f5f8","#5eead4"],"section":"Style"},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8ab8ff' };
  }
}
</script>
</body>
</html>
